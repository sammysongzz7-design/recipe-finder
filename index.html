<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Finder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>🍽️ Recipe Finder</h1>

        <p>Find delicious recipes in seconds!</p>

    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- SEARCH -->
        <section class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a recipe..."
            >

            <button id="searchBtn">
                Search
            </button>

        </section>


        <!-- LOADING -->
        <div id="loading" class="loading">

            👨‍🍳 Finding delicious recipes...

        </div>


        <!-- RECIPES -->
        <section
            class="recipes"
            id="recipes">
        </section>

        <section class="favourites-section">

    <h2>❤️ My Favourites</h2>

    <section
        class="recipes"
        id="favourites">
    </section>

</section>
    </main>


    <!-- RECIPE MODAL -->
    <div
        class="modal"
        id="recipeModal">

        <div class="modal-content">

            <span
                class="close-btn"
                id="closeModal">

                &times;

            </span>


            <div id="modalBody">

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
